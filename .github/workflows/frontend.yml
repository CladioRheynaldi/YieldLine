name: Frontend checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_YIELDLINE_NETWORK: anvil
      NEXT_PUBLIC_ANVIL_RPC_URL: http://127.0.0.1:8545
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Analytics and reference unit tests
        run: node --test frontend/tests/accounting.test.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Deploy isolated Anvil fixture
        env:
          DEPLOYER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
          DEMO_LENDER: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
          DEMO_BORROWER: "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"
        run: |
          anvil --silent > /tmp/yieldline-anvil.log 2>&1 &
          for attempt in {1..20}; do
            if cast block-number --rpc-url http://127.0.0.1:8545; then break; fi
            sleep 1
          done
          pnpm deploy:anvil
      - name: Production build
        run: pnpm build
      - name: Install isolated browser test tools
        run: |
          npm install --prefix frontend/tests/browser --ignore-scripts --package-lock=false
          cd frontend/tests/browser
          npx playwright install --with-deps chromium
      - name: Browser wallet workflows and mobile checks
        run: |
          cd frontend/tests/browser
          npx playwright test
      - name: Browser failure details
        if: failure()
        run: |
          find frontend/tests/browser/test-results -name error-context.md -print -exec cat {} +
      - name: Mobile screenshot for review
        if: always()
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p='frontend/tests/browser/test-results/mobile-markets.png'; if(fs.existsSync(p)) console.log('MOBILE_PNG_BASE64='+fs.readFileSync(p).toString('base64'));"
      - name: Browser traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-results
          if-no-files-found: ignore
          path: |
            frontend/tests/browser/test-results
            frontend/tests/browser/playwright-report
