name: Frontend checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Read installed Next.js guides
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const root = "frontend/node_modules/next/dist/docs";
          function walk(p) {
            return fs.readdirSync(p, {withFileTypes:true}).flatMap(d =>
              d.isDirectory() ? walk(path.join(p,d.name)) : [path.join(p,d.name)]);
          }
          for (const p of walk(root).filter(p => /route-handlers|server-and-client-components|fetching-data|environment-variables/.test(p)).slice(0,8)) {
            console.log("NEXT_GUIDE_BEGIN "+p);
            console.log(fs.readFileSync(p,"utf8").slice(0,20000));
            console.log("NEXT_GUIDE_END");
          }
          NODE
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build
